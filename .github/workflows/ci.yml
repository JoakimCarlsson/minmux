name: Go CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: |
            **/go.mod
            **/go.sum

      - name: Build and vet all modules, and run unit tests
        shell: bash
        run: |
          set -euo pipefail
          modules=$(bash scripts/release.sh modules)
          go work init
          while IFS= read -r module; do
            go work use "./${module}"
          done <<< "$modules"
          while IFS= read -r module; do
            echo "==> ${module}"
            (
              cd "${module}"
              go build ./...
              go vet ./...
              case "${module}" in tests|tests/*) exit 0 ;; esac
              go test -short ./...
            )
          done <<< "$modules"
